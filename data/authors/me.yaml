bio: |
  Hi! I'm Jiale Kong（孔嘉乐）, a fourth-year undergraduate student at Central China Normal University (CCNU), graduating soon. I have been admitted through the recommendation (exam-exempt) program to the Ph.D. program at the Shenyang Institute of Automation (SIA), University of Chinese Academy of Sciences (UCAS), where I am currently working with Prof. [Hao Liu](https://people.ucas.ac.cn/~0041041) and Prof. [Yongming Yang](https://people.ucas.edu.cn/~YongmingYang).

  My research focuses on embodied intelligence for flexible robots, including soft and continuum robots. I am interested in modeling and control of continuum robots, learning-based control with sim-to-real transfer, shape, force and tactile sensing for compliant bodies, vision-based perception and navigation for flexible endoscopic and surgical robots, and vision-language-action models for compliant manipulation.

  **I am actively looking for research collaborations** on flexible robots, embodied intelligence, and their applications in surgical and medical robotics. If my background fits your project, please feel free to reach out by email. I am happy to share my CV and chat.

