# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the id of the
#   block in content/_index.md.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: /
    weight: 10
  - name: Publications
    url: /#publications
    weight: 20
  - name: News
    url: /#news
    weight: 30
  - name: Experience
    url: experience/
    weight: 40
  - name: Posts
    url: blog/
    weight: 50
